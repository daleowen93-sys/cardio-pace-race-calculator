<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cardio Pace &amp; Race Calculator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1 class="app-title">Cardio Pace &amp; Race Calculator</h1>
      <p class="app-subtitle">Choose an activity to get started.</p>
    </header>

    <nav aria-label="Choose an activity">
      <ul class="activity-list">
        <li>
          <a class="activity-card activity-card-running" href="running/index.html">
            <span class="activity-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="13.5" cy="4.5" r="1.75" fill="currentColor" stroke="none"/>
                <path d="M9 20l2-5 3-2-1-4"/>
                <path d="M13 9l3 2 3-1"/>
                <path d="M11 11l-3 1-2 4"/>
                <path d="M13 13l2 3 3 1"/>
              </svg>
            </span>
            <span class="activity-card-label">Running</span>
            <span class="activity-card-chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 6l6 6-6 6"/>
              </svg>
            </span>
          </a>
        </li>
        <li>
          <a class="activity-card activity-card-cycling" href="cycling/index.html">
            <span class="activity-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="5.5" cy="17.5" r="3.5"/>
                <circle cx="18.5" cy="17.5" r="3.5"/>
                <path d="M5.5 17.5L10 8h4l3 5"/>
                <path d="M10 8l3 5H8.5"/>
                <path d="M14 8l4.5 9.5"/>
                <path d="M8 5h2l1.5 3"/>
              </svg>
            </span>
            <span class="activity-card-label">Cycling</span>
            <span class="activity-card-chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 6l6 6-6 6"/>
              </svg>
            </span>
          </a>
        </li>
        <li>
          <a class="activity-card activity-card-swimming" href="swimming/index.html">
            <span class="activity-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="17" cy="5" r="1.75" fill="currentColor" stroke="none"/>
                <path d="M9 9l3-1 3 2 3-1"/>
                <path d="M3 15c1.5 1.5 3 1.5 4.5 0s3-1.5 4.5 0 3 1.5 4.5 0 3-1.5 4.5 0"/>
                <path d="M3 19c1.5 1.5 3 1.5 4.5 0s3-1.5 4.5 0 3 1.5 4.5 0 3-1.5 4.5 0"/>
              </svg>
            </span>
            <span class="activity-card-label">Swimming</span>
            <span class="activity-card-chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 6l6 6-6 6"/>
              </svg>
            </span>
          </a>
        </li>
        <li>
          <a class="activity-card activity-card-triathlon" href="triathlon/index.html">
            <span class="activity-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 9l1.5-5h-3z" fill="currentColor" stroke="none"/>
                <circle cx="12" cy="15" r="6"/>
                <path d="M9.5 15.5l1.5 1.5 3-3.5"/>
              </svg>
            </span>
            <span class="activity-card-label">Triathlon</span>
            <span class="activity-card-chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 6l6 6-6 6"/>
              </svg>
            </span>
          </a>
        </li>
        <li>
          <a class="activity-card activity-card-hyrox" href="hyrox/index.html">
            <span class="activity-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 9c0-2.2 1.3-4 3-4s3 1.8 3 4"/>
                <circle cx="12" cy="15" r="6"/>
              </svg>
            </span>
            <span class="activity-card-label">Hyrox</span>
            <span class="activity-card-chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 6l6 6-6 6"/>
              </svg>
            </span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</body>
</html>
